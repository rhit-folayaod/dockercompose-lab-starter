# STAGE 1 -- the starting point. This file is broken on purpose.
#
# Your job over the next few stages is to turn this into a stack that comes up
# reliably, runs its migrations, talks to a second service, and keeps its data.
#
# Do not fix anything yet. Run it first and watch what happens.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  flyway:
    image: flyway/flyway
    command: migrate
    environment:
      FLYWAY_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      FLYWAY_USER: ${POSTGRES_USER}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./sql:/flyway/sql
    depends_on:
      db:
        condition: service_healthy
  
  ml:
    build:
      context: ./ml
      dockerfile: Dockerfile.serve
    
  api:
    build:
      context: .
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app
    env_file:
      - .env
    environment:
      ML_SERVICE_URL: http://ml:8080
    depends_on:
      db:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully