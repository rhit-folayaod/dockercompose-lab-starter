# STAGE 4 -- a second service. ML_SERVICE_URL is WRONG on purpose.
# Fix it only after you have recorded your prediction about what happens.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  flyway:
    image: flyway/flyway:10
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./sql:/flyway/sql
      - ./flyway.conf:/flyway/conf/flyway.conf
    command: migrate

  ml:
    build:
      context: ./ml
      dockerfile: Dockerfile.serve
    ports:
      - "8080:8080"

  api:
    build:
      context: .
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app
    env_file:
      - .env
    environment:
      ML_SERVICE_URL: "http://localhost:8080"
    depends_on:
      db:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully
      ml:
        condition: service_started
